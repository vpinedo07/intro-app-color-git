<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de Color RGB</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div class="container">
        <nav class="navbar mb-3 navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Aplicación de pruebas de color</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
            </div>
        </nav>

        <h2 class="text-center mb-1">Selector de Color RGB</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card text-center">
                    <div id="colorBox" class="color-box"></div>
                    <div class="card-body">
                        <p id="hexCode" class="fw-bold">#000000</p>
                        <input type="color" id="colorPicker" class="form-control form-control-color mt-2"
                            value="#000000">
                    </div>
                </div>
                <!-- Controles de color -->
                <div class="row mt-3">
                    <div class="col-4">
                        <label for="redRange">Rojo</label>
                        <input type="range" id="redRange" class="form-range" min="0" max="255" value="0">
                        <input type="number" id="redInput" class="form-control mt-2" min="0" max="255" value="0">
                    </div>
                    <div class="col-4">
                        <label for="greenRange">Verde</label>
                        <input type="range" id="greenRange" class="form-range" min="0" max="255" value="0">
                        <input type="number" id="greenInput" class="form-control mt-2" min="0" max="255" value="0">
                    </div>
                    <div class="col-4">
                        <label for="blueRange">Azul</label>
                        <input type="range" id="blueRange" class="form-range" min="0" max="255" value="0">
                        <input type="number" id="blueInput" class="form-control mt-2" min="0" max="255" value="0">
                    </div>
                </div>
            </div>
        </div>
        <footer class="bg-dark text-white text-center py-3 mt-5">
            <p class="mb-0">&copy; 2025 Todos los derechos reservados | Víctor Pinedo</p>
        </footer>
    </div>

    

    <script src="./js/main.js"></script>
</body>

</html>
